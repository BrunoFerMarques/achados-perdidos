name: Pages

# publica a frontend no GitHub Pages a cada merge no master
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# um deploy por vez, sem cancelar o que já começou
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # o site fica em /<nome do repo>/, então os arquivos do build precisam desse prefixo
      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          # a API de produção, no Render
          VITE_API_URL: https://achados-perdidos-i8mk.onrender.com

      # o Pages não manda as rotas do React pro index.html; com o 404.html igual, dar F5 numa
      # rota como /reivindicacoes abre o app em vez da página de erro do GitHub
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
